name: parchapp
description: ParchApp Flutter frontend starter based on the MS6 UI/UX specification.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  cloud_firestore: ^6.10.0
  firebase_analytics: ^12.6.0

  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  crypto: ^3.0.7
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/